# ╔════════════════════════════════════════════════════════════════════════════╗
# ║                     CONFIGURACIÓN: STAGING                                 ║
# ║                    Servidor de Pruebas/Testing                             ║
# ╚════════════════════════════════════════════════════════════════════════════╝
#
# PROPÓSITO:
# Entorno de pruebas para validar cambios antes de producción.
# Replica la configuración de producción pero con datos de prueba.
#
# FLUJO RECOMENDADO:
# 1. Desarrollo en localhost
# 2. Pruebas en staging
# 3. Deploy a producción (papyrus)
#
# USO:
# ./deploy/deploy.sh --env staging --deploy
# ./deploy/deploy.sh --env staging --health
# ./deploy/deploy.sh --env staging --logs
#
# ════════════════════════════════════════════════════════════════════════════

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ INFORMACIÓN BÁSICA                                                         │
# └────────────────────────────────────────────────────────────────────────────┘

ENV_NAME="staging"
ENV_TYPE="remote"                   # Servidor remoto vía SSH
ENV_DESCRIPTION="Servidor de Pruebas"
ENV_COLOR="yellow"                  # Amarillo para staging

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ CONFIGURACIÓN SSH                                                          │
# └────────────────────────────────────────────────────────────────────────────┘

SSH_ENABLED=true
SSH_HOST="staging"                  # Servidor dedicado staging (staging.jemavi.co)
SSH_USER="ubuntu"
SSH_PORT=22
SSH_KEY="~/.ssh/id_rsa"
SSH_OPTIONS="-o StrictHostKeyChecking=no -o ConnectTimeout=10"

# NOTA: Staging corre en servidor dedicado con recursos mínimos (416MB RAM + 1GB SWAP)

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ GIT                                                                        │
# └────────────────────────────────────────────────────────────────────────────┘

GIT_ENABLED=true
GIT_AUTO_COMMIT=true                # Commit automático
GIT_AUTO_PUSH=true                  # Push automático
GIT_BRANCH="staging"                # Rama dedicada para staging

# NOTA: Staging usa rama 'staging' dedicada

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ DOCKER                                                                     │
# └────────────────────────────────────────────────────────────────────────────┘

DOCKER_ENABLED=true
DOCKER_COMPOSE_FILE="docker-compose.staging.yml"  # Config minimal (solo app)
DOCKER_PROJECT_NAME="paqueteria_staging"          # Prefijo staging
DOCKER_REBUILD_ON_DEPLOY=true                     # SÍ rebuild (necesario para cambios de código)
DOCKER_PULL_BEFORE_DEPLOY=false                   # No pull (imagen local)

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ RUTAS EN SERVIDOR                                                          │
# └────────────────────────────────────────────────────────────────────────────┘

PROJECT_PATH="/home/ubuntu/paqueteria-staging"   # Ruta en servidor staging dedicado
BACKUP_PATH="/home/ubuntu/backups"               # Backups locales

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ SERVICIOS                                                                  │
# └────────────────────────────────────────────────────────────────────────────┘

SERVICES=("app")                                  # Solo app (ultra minimal)
MAIN_SERVICE="app"
OPTIONAL_SERVICES=()                              # Sin redis, sin celery

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ URLs                                                                       │
# └────────────────────────────────────────────────────────────────────────────┘

BASE_URL="https://staging.jemavi.co"             # URL pública de staging (con SSL)
HEALTH_CHECK_URL="http://localhost:8001/health"  # Puerto 8001 (staging mapea 8001->8000)
API_URL="http://localhost:8001/api"

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ HEALTH CHECK                                                               │
# └────────────────────────────────────────────────────────────────────────────┘

HEALTH_CHECK_ENABLED=true
HEALTH_CHECK_TIMEOUT=60             # 60s (servidor lento)
HEALTH_CHECK_RETRIES=30             # 30 intentos
HEALTH_CHECK_INTERVAL=2             # Cada 2 segundos

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ MIGRACIONES                                                                │
# └────────────────────────────────────────────────────────────────────────────┘

MIGRATIONS_ENABLED=false            # Deshabilitado (misma BD que producción)
MIGRATIONS_AUTO=false
MIGRATIONS_COMMAND="docker compose -f docker-compose.staging.yml exec -T app alembic upgrade heads"
MIGRATIONS_ROLLBACK_COMMAND="docker compose -f docker-compose.staging.yml exec app alembic downgrade -1"

# NOTA: Migraciones deshabilitadas porque staging comparte BD con producción

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ BACKUP                                                                     │
# └────────────────────────────────────────────────────────────────────────────┘

BACKUP_ENABLED=false                # Deshabilitado (misma BD que producción)
BACKUP_AUTO_BEFORE_DEPLOY=false     # No hacer backup (BD compartida)
BACKUP_DB_COMMAND=""
BACKUP_RETENTION_DAYS=0

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ TESTS                                                                      │
# └────────────────────────────────────────────────────────────────────────────┘

TESTS_ENABLED=false                 # No tests (solo cambios visuales)
TESTS_COMMAND=""
TESTS_REQUIRED=false

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ HOOKS                                                                      │
# └────────────────────────────────────────────────────────────────────────────┘

PRE_DEPLOY_HOOK=""                  # Sin hooks por ahora
POST_DEPLOY_HOOK=""
PRE_BACKUP_HOOK=""
POST_BACKUP_HOOK=""

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ NOTIFICACIONES                                                             │
# └────────────────────────────────────────────────────────────────────────────┘

NOTIFY_ON_SUCCESS=false             # No notificar éxitos
NOTIFY_ON_ERROR=true                # Solo notificar errores

# ════════════════════════════════════════════════════════════════════════════
# NOTAS SOBRE STAGING:
# ════════════════════════════════════════════════════════════════════════════
#
# SERVIDOR DEDICADO:
# - IP: 3.81.183.102
# - Dominio: staging.jemavi.co
# - RAM: 416MB + 1GB SWAP
# - CPU: 2 cores
# - Disco: 19GB
#
# CONFIGURACIÓN ULTRA MINIMAL:
# - Solo App (sin Redis, sin Celery, sin monitoring)
# - Límite de memoria: 300MB
# - 1 worker de Uvicorn
# - Logs mínimos (5MB max)
#
# PROPÓSITO:
# - Visualizar cambios CSS/HTML/JS
# - Probar templates y estilos
# - NO para probar lógica de negocio
# - NO para migraciones de BD
#
# FLUJO RECOMENDADO:
# 1. Editar CSS/HTML en local
# 2. Commit a rama staging
# 3. Deploy: ./deploy.sh --env staging --deploy
# 4. Verificar en: http://staging.jemavi.co
# 5. Si OK, merge staging → main
# 6. Deploy a producción
#
# EDICIÓN SIN REBUILD:
# - Archivos en /static y /templates son volúmenes
# - Cambios se ven con solo restart del contenedor
# - No necesita rebuild completo
#
# ════════════════════════════════════════════════════════════════════════════
