# ╔════════════════════════════════════════════════════════════════════════════╗
# ║                     CONFIGURACIÓN: STAGING                                 ║
# ║                    Servidor de Pruebas/Testing                             ║
# ╚════════════════════════════════════════════════════════════════════════════╝
#
# PROPÓSITO:
# Entorno de pruebas para validar cambios antes de producción.
# Replica la configuración de producción pero con datos de prueba.
#
# FLUJO RECOMENDADO:
# 1. Desarrollo en localhost
# 2. Pruebas en staging
# 3. Deploy a producción (papyrus)
#
# USO:
# ./deploy/deploy.sh --env staging --deploy
# ./deploy/deploy.sh --env staging --health
# ./deploy/deploy.sh --env staging --logs
#
# ════════════════════════════════════════════════════════════════════════════

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ INFORMACIÓN BÁSICA                                                         │
# └────────────────────────────────────────────────────────────────────────────┘

ENV_NAME="staging"
ENV_TYPE="remote"                   # Servidor remoto vía SSH
ENV_DESCRIPTION="Servidor de Pruebas"
ENV_COLOR="yellow"                  # Amarillo para staging

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ CONFIGURACIÓN SSH                                                          │
# └────────────────────────────────────────────────────────────────────────────┘

SSH_ENABLED=true
SSH_HOST="18.214.124.14"            # Mismo servidor que producción
SSH_USER="ubuntu"
SSH_PORT=22
SSH_KEY="~/.ssh/id_rsa"
SSH_OPTIONS="-o StrictHostKeyChecking=no -o ConnectTimeout=10"

# NOTA: Staging corre en el mismo servidor que producción pero en ruta separada

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ GIT                                                                        │
# └────────────────────────────────────────────────────────────────────────────┘

GIT_ENABLED=true
GIT_AUTO_COMMIT=true                # Commit automático
GIT_AUTO_PUSH=true                  # Push automático
GIT_BRANCH="staging"                # Rama dedicada para staging

# NOTA: Staging usa rama 'staging' dedicada

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ DOCKER                                                                     │
# └────────────────────────────────────────────────────────────────────────────┘

DOCKER_ENABLED=true
DOCKER_COMPOSE_FILE="docker-compose.staging.yml"  # Config de staging
DOCKER_PROJECT_NAME="paqueteria_staging"          # Prefijo staging
DOCKER_REBUILD_ON_DEPLOY=true                     # Rebuild para cambios estéticos
DOCKER_PULL_BEFORE_DEPLOY=false                   # No pull (imagen local)

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ RUTAS EN SERVIDOR                                                          │
# └────────────────────────────────────────────────────────────────────────────┘

PROJECT_PATH="/home/ubuntu/paqueteria-staging"   # Ruta separada de producción
BACKUP_PATH="/home/ubuntu/backups"               # Mismo backup que producción

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ SERVICIOS                                                                  │
# └────────────────────────────────────────────────────────────────────────────┘

SERVICES=("app" "redis")                          # Solo app y redis (mínimo)
MAIN_SERVICE="app"
OPTIONAL_SERVICES=()

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ URLs                                                                       │
# └────────────────────────────────────────────────────────────────────────────┘

BASE_URL="https://staging.jemavi.co"             # URL pública de staging
HEALTH_CHECK_URL="http://localhost:8001/health"  # Puerto 8001 (staging)
API_URL="http://localhost:8001/api"

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ HEALTH CHECK                                                               │
# └────────────────────────────────────────────────────────────────────────────┘

HEALTH_CHECK_ENABLED=true
HEALTH_CHECK_TIMEOUT=45             # 45s
HEALTH_CHECK_RETRIES=20             # 20 intentos
HEALTH_CHECK_INTERVAL=2             # Cada 2 segundos

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ MIGRACIONES                                                                │
# └────────────────────────────────────────────────────────────────────────────┘

MIGRATIONS_ENABLED=false            # Deshabilitado (misma BD que producción)
MIGRATIONS_AUTO=false
MIGRATIONS_COMMAND="docker compose -f docker-compose.staging.yml exec app alembic upgrade head"
MIGRATIONS_ROLLBACK_COMMAND="docker compose -f docker-compose.staging.yml exec app alembic downgrade -1"

# NOTA: Migraciones deshabilitadas porque staging comparte BD con producción

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ BACKUP                                                                     │
# └────────────────────────────────────────────────────────────────────────────┘

BACKUP_ENABLED=false                # Deshabilitado (misma BD que producción)
BACKUP_AUTO_BEFORE_DEPLOY=false     # No hacer backup (BD compartida)
BACKUP_DB_COMMAND=""
BACKUP_RETENTION_DAYS=0

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ TESTS                                                                      │
# └────────────────────────────────────────────────────────────────────────────┘

TESTS_ENABLED=false                 # No tests (solo cambios visuales)
TESTS_COMMAND=""
TESTS_REQUIRED=false

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ HOOKS                                                                      │
# └────────────────────────────────────────────────────────────────────────────┘

PRE_DEPLOY_HOOK=""                  # Sin hooks por ahora
POST_DEPLOY_HOOK=""
PRE_BACKUP_HOOK=""
POST_BACKUP_HOOK=""

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ NOTIFICACIONES                                                             │
# └────────────────────────────────────────────────────────────────────────────┘

NOTIFY_ON_SUCCESS=false             # No notificar éxitos
NOTIFY_ON_ERROR=true                # Solo notificar errores

# ════════════════════════════════════════════════════════════════════════════
# NOTAS SOBRE STAGING:
# ════════════════════════════════════════════════════════════════════════════
#
# PROPÓSITO:
# - Probar cambios antes de producción
# - Validar migraciones de BD
# - Ejecutar tests de integración
# - Verificar configuración de producción
#
# DIFERENCIAS CON PRODUCCIÓN:
# - Usa rama 'develop' en lugar de 'main'
# - Migraciones automáticas (para probar)
# - Tests habilitados
# - Menos retención de backups (14 vs 30 días)
#
# FLUJO RECOMENDADO:
# 1. Desarrollar en localhost
# 2. Commit a rama develop
# 3. Deploy a staging: ./deploy/deploy.sh --env staging --deploy
# 4. Probar en staging
# 5. Si todo OK, merge develop → main
# 6. Deploy a producción: ./deploy/deploy.sh --env papyrus --deploy
#
# ════════════════════════════════════════════════════════════════════════════
