# ========================================
# NGINX CONFIGURACIÓN PARA STAGING
# ========================================
# Dominio: staging.jemavi.co
# Puertos: 8080 (HTTP) y 8443 (HTTPS)
# Backend: localhost:8001 (blue) o localhost:8002 (green) — DINÁMICO
# Blue-Green Deployment: upstream seteado dinámicamente por bg-deploy.sh
# ========================================

# Upstream dinámico — controlado por Blue-Green deployment
include /home/ubuntu/paqueteria-staging/active-upstream.conf;

# Servidor HTTP (puerto 8080)
server {
    listen 8080;
    server_name staging.jemavi.co;
    
    client_max_body_size 10m;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Environment "STAGING" always;
    
    # Static files
    location /static/ {
        alias /home/ubuntu/paqueteria-staging/CODE/src/static/;
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Environment "STAGING" always;
    }
    
    # Uploads
    location /uploads/ {
        alias /home/ubuntu/paqueteria-staging/CODE/src/uploads/;
        expires 1h;
        add_header Cache-Control "public";
    }
    
    # Health check
    location /health {
        proxy_pass http://fastapi_staging;
        access_log off;
    }
    
    # API routes
    location /api/ {
        proxy_pass http://fastapi_staging;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # All other routes
    location / {
        proxy_pass http://fastapi_staging;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

# Servidor HTTPS (puerto 8443) - Se configurará con Certbot
server {
    listen 8443 ssl http2;
    server_name staging.jemavi.co;
    
    # Certificados SSL (se configurarán con Certbot)
    # ssl_certificate /etc/letsencrypt/live/staging.jemavi.co/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/staging.jemavi.co/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    client_max_body_size 10m;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Environment "STAGING" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    
    # Static files
    location /static/ {
        alias /home/ubuntu/paqueteria-staging/CODE/src/static/;
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Environment "STAGING" always;
    }
    
    # Uploads
    location /uploads/ {
        alias /home/ubuntu/paqueteria-staging/CODE/src/uploads/;
        expires 1h;
        add_header Cache-Control "public";
    }
    
    # Health check
    location /health {
        proxy_pass http://fastapi_staging;
        access_log off;
    }
    
    # API routes
    location /api/ {
        proxy_pass http://fastapi_staging;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # All other routes
    location / {
        proxy_pass http://fastapi_staging;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
