# ========================================
# NGINX STAGING - ULTRA MINIMAL
# ========================================
# Configuración optimizada para 416MB RAM
# ========================================

# Upstream FastAPI
upstream fastapi_staging {
    server 127.0.0.1:8001 max_fails=2 fail_timeout=20s;
    keepalive 8;
}

# HTTP Server
server {
    listen 80;
    server_name staging.jemavi.co;
    
    client_max_body_size 5m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    
    # Security headers básicos
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Static files
    location /static/ {
        alias /home/ubuntu/paqueteria-staging/CODE/src/static/;
        expires 3d;
        add_header Cache-Control "public";
        access_log off;
    }
    
    # Uploads
    location /uploads/ {
        alias /home/ubuntu/paqueteria-staging/CODE/src/uploads/;
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }
    
    # Health check
    location /health {
        proxy_pass http://fastapi_staging;
        access_log off;
    }
    
    # All routes
    location / {
        proxy_pass http://fastapi_staging;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_buffering off;
    }
}
