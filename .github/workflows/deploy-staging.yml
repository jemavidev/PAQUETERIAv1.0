name: 🚀 Deploy to Staging (Automático)

on:
  push:
    branches:
      - staging

env:
  STAGING_HOST: staging.jemavi.co
  STAGING_USER: ubuntu
  PROJECT_PATH: /home/ubuntu/paqueteria-staging
  DEPLOY_SCRIPT: ./deploy.sh

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: 🔍 Validar Python syntax
        run: |
          python3 -m py_compile CODE/src/app/models/invoice_v2.py 2>&1 || echo "⚠️  Syntax check skipped"
          python3 -m py_compile CODE/alembic/versions/20260503_061946_add_cufe_manual_fields.py 2>&1 || echo "⚠️  Migration syntax check skipped"

      - name: 🔑 Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H ${{ env.STAGING_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 📤 Git Pull & Deploy
        run: |
          ssh -i ~/.ssh/staging_key -o StrictHostKeyChecking=accept-new ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} "cd ${{ env.PROJECT_PATH }} && git fetch origin && git checkout staging && git reset --hard origin/staging"

      - name: 🔵🟢 Blue-Green Deploy
        run: |
          ssh -i ~/.ssh/staging_key ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} "cd ${{ env.PROJECT_PATH }} && bash .deploy/scripts/bg-deploy.sh"

      - name: ✅ Health Check
        run: |
          for attempt in {1..3}; do
            echo "🔍 Health check intento $attempt/3..."
            if ssh -i ~/.ssh/staging_key ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} \
              "curl -s http://localhost:8001/health 2>/dev/null || curl -s http://localhost:8001/ 2>/dev/null" > /dev/null 2>&1; then
              echo "✅ Service is healthy!"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "⏳ Service not ready yet, waiting 10 seconds..."
              sleep 10
            fi
          done
          echo "⚠️  Service health check inconclusive (may still be starting)"
          exit 0

      - name: 📊 Verify Database Migration
        run: |
          ssh -i ~/.ssh/staging_key ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} \
            "cd ${{ env.PROJECT_PATH }}/CODE && \
             docker exec paqueteria_staging_app alembic current 2>&1 || echo '⚠️  Migration check skipped'"

      - name: 🎉 Deployment Success
        if: success()
        run: |
          echo "✅ Deploy a staging completado exitosamente"
          echo ""
          echo "🔗 Acceder a staging:"
          echo "   https://staging.paquetex.papyrus.com.co"
          echo ""
          echo "📋 Ver logs en GitHub Actions:"
          echo "   https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "❌ Deploy a staging falló"
          echo ""
          echo "🔧 Troubleshooting:"
          echo "   1. Revisar logs aquí: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "   2. SSH manual: ssh staging"
          echo "   3. Ver logs: docker logs paqueteria_staging_app"
          echo "   4. Rollback: cd /home/ubuntu/paqueteria-staging && git reset --hard HEAD~1"
          exit 1
