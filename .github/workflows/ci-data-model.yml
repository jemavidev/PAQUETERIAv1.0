name: CI — data-model

# Arnés de CI de la rebanada data-model: construye la BD con `alembic upgrade
# head` sobre un Postgres efímero y corre los tests de integración del dominio.
# No toca deploy-staging.yml.

on:
  push:
    branches: [ "PaqueteXv.2" ]
    paths:
      - "CODE/src/app/domain/**"
      - "CODE/alembic/**"
      - "CODE/tests/data_model/**"
      - "CODE/requirements-ci.txt"
      - "CODE/pytest.ini"
      - ".github/workflows/ci-data-model.yml"
  pull_request:
    branches: [ "PaqueteXv.2", "main" ]
    paths:
      - "CODE/src/app/domain/**"
      - "CODE/alembic/**"
      - "CODE/tests/data_model/**"
      - "CODE/requirements-ci.txt"
      - "CODE/pytest.ini"
      - ".github/workflows/ci-data-model.yml"

jobs:
  data-model-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paquetex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Con TEST_DATABASE_URL definido, el arnés NO usa docker: corre contra el
      # service:postgres efímero de arriba.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paquetex_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del arnés
        working-directory: CODE
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Tests (esquema construido con `alembic upgrade head`)
        working-directory: CODE
        run: pytest -v
