<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Autenticación - Mensajes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h1 class="text-2xl font-bold text-gray-900 mb-4">🔐 Test de Autenticación - Mensajes</h1>
            <p class="text-gray-600 mb-4">Esta página te ayudará a diagnosticar problemas de autenticación con el modal de mensajes.</p>
            
            <button onclick="runTests()" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors">
                Ejecutar Tests
            </button>
        </div>

        <div id="results" class="space-y-4"></div>
    </div>

    <script>
        function addResult(title, status, message, details = null) {
            const resultsDiv = document.getElementById('results');
            const statusColors = {
                'success': 'bg-green-50 border-green-200 text-green-800',
                'error': 'bg-red-50 border-red-200 text-red-800',
                'warning': 'bg-yellow-50 border-yellow-200 text-yellow-800',
                'info': 'bg-blue-50 border-blue-200 text-blue-800'
            };
            
            const statusIcons = {
                'success': '✅',
                'error': '❌',
                'warning': '⚠️',
                'info': 'ℹ️'
            };
            
            const html = `
                <div class="${statusColors[status]} border rounded-lg p-4">
                    <div class="flex items-start">
                        <span class="text-2xl mr-3">${statusIcons[status]}</span>
                        <div class="flex-1">
                            <h3 class="font-bold text-lg mb-2">${title}</h3>
                            <p class="mb-2">${message}</p>
                            ${details ? `<pre class="bg-white p-3 rounded text-xs overflow-x-auto">${JSON.stringify(details, null, 2)}</pre>` : ''}
                        </div>
                    </div>
                </div>
            `;
            
            resultsDiv.insertAdjacentHTML('beforeend', html);
        }

        async function runTests() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="text-center py-8"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div><p class="mt-4 text-gray-600">Ejecutando tests...</p></div>';
            
            await new Promise(resolve => setTimeout(resolve, 500));
            resultsDiv.innerHTML = '';
            
            // Test 1: Verificar cookies
            addResult(
                'Test 1: Verificar Cookies',
                'info',
                'Verificando cookies del navegador...'
            );
            
            const cookies = document.cookie;
            const hasCookies = cookies.length > 0;
            const hasAccessToken = cookies.includes('access_token=');
            const hasUserName = cookies.includes('user_name=');
            
            if (hasCookies) {
                addResult(
                    'Cookies Encontradas',
                    hasAccessToken ? 'success' : 'warning',
                    hasAccessToken ? 
                        'Se encontró la cookie access_token' : 
                        'No se encontró la cookie access_token',
                    {
                        cookies: cookies.split('; ').reduce((acc, cookie) => {
                            const [key, value] = cookie.split('=');
                            acc[key] = value.substring(0, 20) + (value.length > 20 ? '...' : '');
                            return acc;
                        }, {})
                    }
                );
            } else {
                addResult(
                    'Sin Cookies',
                    'error',
                    'No se encontraron cookies. Necesitas iniciar sesión.',
                    { redirect: 'https://staging.jemavi.co/auth/login' }
                );
                return;
            }
            
            // Test 2: Probar endpoint de mensajes
            addResult(
                'Test 2: Probar Endpoint de Mensajes',
                'info',
                'Intentando acceder a /api/messages/52...'
            );
            
            try {
                const response = await fetch('/api/messages/52', {
                    method: 'GET',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    addResult(
                        'Endpoint Accesible',
                        'success',
                        'El endpoint respondió correctamente. Tu autenticación es válida.',
                        {
                            status: response.status,
                            message_id: data.id,
                            subject: data.subject,
                            status_msg: data.status
                        }
                    );
                } else if (response.status === 401) {
                    addResult(
                        'No Autenticado',
                        'error',
                        'El servidor indica que no estás autenticado. Tu sesión puede haber expirado.',
                        data
                    );
                } else if (response.status === 404) {
                    addResult(
                        'Mensaje No Encontrado',
                        'warning',
                        'El mensaje ID 52 no existe en la base de datos.',
                        data
                    );
                } else {
                    addResult(
                        'Error del Servidor',
                        'error',
                        `El servidor respondió con código ${response.status}`,
                        data
                    );
                }
            } catch (error) {
                addResult(
                    'Error de Red',
                    'error',
                    'No se pudo conectar con el servidor.',
                    { error: error.message }
                );
            }
            
            // Test 3: Probar función openMessageDetail
            addResult(
                'Test 3: Verificar Función JavaScript',
                'info',
                'Verificando si la función openMessageDetail existe...'
            );
            
            if (typeof openMessageDetail === 'function') {
                addResult(
                    'Función Disponible',
                    'success',
                    'La función openMessageDetail está disponible. Puedes probarla manualmente con: openMessageDetail(52)'
                );
            } else {
                addResult(
                    'Función No Disponible',
                    'warning',
                    'La función openMessageDetail no está disponible en esta página. Debes estar en /messages para usarla.'
                );
            }
            
            // Test 4: Recomendaciones
            addResult(
                'Recomendaciones',
                'info',
                hasAccessToken && hasUserName ? 
                    'Tu autenticación parece estar correcta. Si el modal no funciona, verifica que estés en la página /messages.' :
                    'Necesitas iniciar sesión para acceder a los mensajes.',
                {
                    next_steps: hasAccessToken ? [
                        'Ve a https://staging.jemavi.co/messages',
                        'Haz clic en el botón verde del mensaje',
                        'El modal debería abrirse correctamente'
                    ] : [
                        'Ve a https://staging.jemavi.co/auth/login',
                        'Inicia sesión con tus credenciales',
                        'Regresa a /messages y prueba nuevamente'
                    ]
                }
            );
        }
        
        // Ejecutar tests automáticamente al cargar
        window.addEventListener('load', () => {
            setTimeout(runTests, 500);
        });
    </script>
</body>
</html>
