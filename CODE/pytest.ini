# Los 63 tests viejos (CUFE/facturas/productos/parser) están fuera de alcance y
# no se recogen por defecto; esta rebanada establece el patrón de integración
# del dominio núcleo.
testpaths = tests/data_model
pythonpath = src
markers =
    integration: requiere un Postgres efímero construido con `alembic upgrade head`
