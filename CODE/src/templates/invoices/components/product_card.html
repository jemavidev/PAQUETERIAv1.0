<!-- ========================================
     PAQUETES EL CLUB - Componente Product Card
     ======================================== -->
<!--
Componente para mostrar tarjeta de producto.

Uso:
{% include 'invoices/components/product_card.html' with product=product %}

Props:
- product: Objeto de producto con todos sus datos
-->

<div x-data="{
    product: {{ product | tojson if product else '{}' }},
    
    formatCurrency(amount) {
        if (!amount) return '$0';
        return '$' + amount.toLocaleString('es-CO');
    },
    
    get matchStatus() {
        if (!this.product.matched) return 'unmatched';
        if (this.product.match_confidence >= 0.95) return 'high';
        if (this.product.match_confidence >= 0.85) return 'medium';
        return 'low';
    },
    
    get matchBadgeClass() {
        const classes = {
            'unmatched': 'bg-gray-100 text-gray-800 border-gray-300',
            'low': 'bg-yellow-100 text-yellow-800 border-yellow-300',
            'medium': 'bg-blue-100 text-blue-800 border-blue-300',
            'high': 'bg-green-100 text-green-800 border-green-300'
        };
        return classes[this.matchStatus];
    },
    
    get matchLabel() {
        const labels = {
            'unmatched': 'Sin match',
            'low': 'Match bajo',
            'medium': 'Match medio',
            'high': 'Match alto'
        };
        return labels[this.matchStatus];
    }
}" class="bg-white dark:bg-gray-800 rounded-lg shadow-md hover:shadow-lg transition-shadow p-4 border border-gray-200 dark:border-gray-700">
    
    <!-- Header -->
    <div class="flex items-start justify-between mb-3">
        <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
                <span class="text-xs font-mono bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded text-gray-700 dark:text-gray-300"
                      x-text="product.codigo || 'Sin código'"></span>
                
                <!-- Match Badge -->
                <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium border"
                      :class="matchBadgeClass"
                      x-text="matchLabel"></span>
            </div>
            
            <h3 class="text-sm font-medium text-gray-900 dark:text-white line-clamp-2" 
                x-text="product.descripcion"></h3>
        </div>
    </div>
    
    <!-- Info Grid -->
    <div class="grid grid-cols-2 gap-2 mb-3 text-sm">
        <div>
            <span class="text-gray-600 dark:text-gray-400">Cantidad:</span>
            <span class="font-medium text-gray-900 dark:text-white" x-text="product.cantidad"></span>
        </div>
        <div>
            <span class="text-gray-600 dark:text-gray-400">Precio:</span>
            <span class="font-medium text-gray-900 dark:text-white" x-text="formatCurrency(product.precio_unitario)"></span>
        </div>
        <div>
            <span class="text-gray-600 dark:text-gray-400">IVA:</span>
            <span class="font-medium text-gray-900 dark:text-white" x-text="product.iva_porcentaje + '%'"></span>
        </div>
        <div>
            <span class="text-gray-600 dark:text-gray-400">Total:</span>
            <span class="font-bold text-gray-900 dark:text-white" x-text="formatCurrency(product.valor_total)"></span>
        </div>
    </div>
    
    <!-- Margin (if matched) -->
    <div class="mb-3" x-show="product.matched && product.margin">
        <span class="text-xs text-gray-600 dark:text-gray-400 block mb-1">Margen:</span>
        {% include 'invoices/components/margin_badge.html' with margin='product.margin.margin_percentage' %}
    </div>
    
    <!-- Match Info -->
    <div class="text-xs text-gray-600 dark:text-gray-400 mb-3" x-show="product.matched">
        <span>Match: </span>
        <span x-text="product.match_method"></span>
        <span x-show="product.match_confidence">
            (<span x-text="(product.match_confidence * 100).toFixed(0)"></span>%)
        </span>
    </div>
    
    <!-- Actions -->
    <div class="flex gap-2 pt-3 border-t border-gray-200 dark:border-gray-700">
        <button @click="$dispatch('view-product', product)"
                class="flex-1 px-3 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors">
            Ver Detalles
        </button>
        
        <button x-show="!product.matched"
                @click="$dispatch('match-product', product)"
                class="px-3 py-2 text-sm bg-green-600 text-white rounded hover:bg-green-700 transition-colors">
            Hacer Match
        </button>
    </div>
    
</div>
