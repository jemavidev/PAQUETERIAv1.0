<!-- Modal CUFE -->
<div id="cufe-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-2/3 lg:w-1/2 shadow-lg rounded-lg bg-white">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold">Agregar Código CUFE</h3>
            <button onclick="closeCufeModal()" class="text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Código CUFE</label>
                <textarea id="cufe-input" 
                          rows="3" 
                          placeholder="Pega aquí el código CUFE completo..."
                          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-papyrus-blue focus:border-transparent"></textarea>
                <p class="mt-1 text-xs text-gray-500">El sistema descargará automáticamente el PDF desde DIAN</p>
            </div>
        </div>
        
        <div class="mt-6 flex justify-end gap-2">
            <button onclick="closeCufeModal()" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
                Cancelar
            </button>
            <button onclick="submitCufe()" class="px-4 py-2 bg-papyrus-blue text-white rounded-lg hover:bg-blue-700">
                Descargar desde DIAN
            </button>
        </div>
    </div>
</div>

<script>
function openCufeModal() {
    document.getElementById('cufe-modal').classList.remove('hidden');
}

function closeCufeModal() {
    document.getElementById('cufe-modal').classList.add('hidden');
    document.getElementById('cufe-input').value = '';
}

async function submitCufe() {
    const cufe = document.getElementById('cufe-input').value.trim();
    
    if (!cufe) {
        alert('Por favor ingresa un código CUFE');
        return;
    }
    
    try {
        const response = await fetch('/api/invoices/import-cufe', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({cufe: cufe})
        });
        
        if (response.ok) {
            alert('CUFE agregado exitosamente. Descargando desde DIAN...');
            closeCufeModal();
            loadCufeTab();
        } else {
            const error = await response.json();
            alert('Error: ' + (error.detail || 'No se pudo procesar el CUFE'));
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Error al procesar el CUFE');
    }
}
</script>
