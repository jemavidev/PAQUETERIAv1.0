<!-- Modal Match Manual -->
<div id="match-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-2/3 shadow-lg rounded-lg bg-white">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold">Vincular Producto con Catálogo</h3>
            <button onclick="closeMatchModal()" class="text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        
        <div class="space-y-4">
            <div class="bg-gray-50 p-4 rounded-lg">
                <h4 class="font-medium mb-2">Producto de Factura:</h4>
                <p id="item-info" class="text-sm text-gray-600"></p>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Buscar en Catálogo</label>
                <input type="text" 
                       id="search-catalog" 
                       placeholder="Buscar por código, nombre..."
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-papyrus-blue focus:border-transparent">
            </div>
            
            <div id="catalog-results" class="max-h-96 overflow-y-auto space-y-2">
                <!-- Resultados de búsqueda -->
            </div>
        </div>
        
        <div class="mt-6 flex justify-end gap-2">
            <button onclick="closeMatchModal()" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
                Cancelar
            </button>
        </div>
    </div>
</div>

<script>
let currentItemId = null;

function openMatchModal(itemId, itemInfo) {
    currentItemId = itemId;
    document.getElementById('item-info').textContent = itemInfo;
    document.getElementById('match-modal').classList.remove('hidden');
}

function closeMatchModal() {
    document.getElementById('match-modal').classList.add('hidden');
    currentItemId = null;
    document.getElementById('search-catalog').value = '';
    document.getElementById('catalog-results').innerHTML = '';
}

async function searchCatalog(query) {
    try {
        const response = await fetch(`/api/products/search?q=${encodeURIComponent(query)}`);
        const products = await response.json();
        
        const resultsDiv = document.getElementById('catalog-results');
        resultsDiv.innerHTML = products.map(p => `
            <div class="border rounded-lg p-3 hover:bg-gray-50 cursor-pointer" onclick="linkProduct(${currentItemId}, ${p.id})">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="font-medium">${p.codigo} - ${p.nombre}</p>
                        <p class="text-sm text-gray-600">Precio: $${p.precio_venta.toLocaleString()}</p>
                    </div>
                    <button class="px-3 py-1 bg-papyrus-blue text-white text-sm rounded hover:bg-blue-700">
                        Vincular
                    </button>
                </div>
            </div>
        `).join('');
    } catch (error) {
        console.error('Error:', error);
    }
}

async function linkProduct(itemId, productId) {
    try {
        const response = await fetch(`/api/invoice-items/${itemId}/link-product`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({product_id: productId})
        });
        
        if (response.ok) {
            alert('Producto vinculado exitosamente');
            closeMatchModal();
            loadProductosTab();
        } else {
            alert('Error al vincular producto');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Error al vincular producto');
    }
}

// Búsqueda con debounce
let searchTimeout;
document.getElementById('search-catalog')?.addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        if (e.target.value.length >= 3) {
            searchCatalog(e.target.value);
        }
    }, 300);
});
</script>
