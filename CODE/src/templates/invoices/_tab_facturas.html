<!-- Modal Upload -->
<div id="upload-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-1/2 shadow-lg rounded-lg bg-white">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold">Subir Facturas de Proveedores</h3>
            <button onclick="closeUploadModal()" class="text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        
        <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center">
            <input type="file" id="pdf-files" multiple accept=".pdf" class="hidden" onchange="handleFileSelect(event)">
            <label for="pdf-files" class="cursor-pointer">
                <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                </svg>
                <p class="mt-2 text-sm text-gray-600">Arrastra archivos PDF aquí o haz clic para seleccionar</p>
                <p class="mt-1 text-xs text-gray-500">Puedes subir múltiples archivos a la vez</p>
            </label>
        </div>
        
        <div id="files-list" class="mt-4 space-y-2"></div>
        
        <div class="mt-6 flex justify-end gap-2">
            <button onclick="closeUploadModal()" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
                Cancelar
            </button>
            <button onclick="uploadFiles()" id="upload-btn" class="px-4 py-2 bg-papyrus-blue text-white rounded-lg hover:bg-blue-700 disabled:opacity-50" disabled>
                Subir Archivos
            </button>
        </div>
    </div>
</div>

<script>
let selectedFiles = [];

function openUploadModal() {
    document.getElementById('upload-modal').classList.remove('hidden');
}

function closeUploadModal() {
    document.getElementById('upload-modal').classList.add('hidden');
    selectedFiles = [];
    document.getElementById('files-list').innerHTML = '';
    document.getElementById('pdf-files').value = '';
}

function handleFileSelect(event) {
    selectedFiles = Array.from(event.target.files);
    displayFilesList();
    document.getElementById('upload-btn').disabled = selectedFiles.length === 0;
}

function displayFilesList() {
    const filesList = document.getElementById('files-list');
    filesList.innerHTML = selectedFiles.map((file, index) => `
        <div class="flex items-center justify-between p-2 bg-gray-50 rounded">
            <span class="text-sm">${file.name}</span>
            <button onclick="removeFile(${index})" class="text-red-500 hover:text-red-700">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    `).join('');
}

function removeFile(index) {
    selectedFiles.splice(index, 1);
    displayFilesList();
    document.getElementById('upload-btn').disabled = selectedFiles.length === 0;
}

async function uploadFiles() {
    const formData = new FormData();
    selectedFiles.forEach(file => formData.append('files', file));
    
    try {
        const response = await fetch('/api/supplier-invoices/upload', {
            method: 'POST',
            body: formData
        });
        
        if (response.ok) {
            alert('Archivos subidos exitosamente');
            closeUploadModal();
            loadFacturasTab();
        } else {
            alert('Error al subir archivos');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Error al subir archivos');
    }
}
</script>
