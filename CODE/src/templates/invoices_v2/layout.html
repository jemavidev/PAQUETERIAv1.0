{% extends "base/base.html" %}

{% block title %}{% block page_title %}Sistema de Facturas{% endblock %} - PAQUETEX{% endblock %}

{% block content %}
<!-- Main Content -->
<div class="max-w-7xl mx-auto px-3 sm:px-4 lg:px-6 xl:px-8 py-3 sm:py-4 lg:py-6 xl:py-8">
    <div class="space-y-4 sm:space-y-6">
        <!-- Tabs Navigation de Facturas -->
        <div class="bg-white rounded-xl shadow-lg border border-gray-100 p-3 sm:p-4 lg:p-6 mb-4 sm:mb-6">
            <div class="flex items-center">
                <!-- Tabs compactos -->
                <div class="flex items-center border border-gray-200 rounded-lg overflow-hidden">
                    <a href="/invoices/facturas" 
                       class="px-4 py-2 text-sm font-medium whitespace-nowrap {% if active_tab == 'facturas' %}bg-papyrus-blue text-white{% else %}text-gray-600 hover:bg-gray-50{% endif %} transition-colors duration-200">
                        FACTURAS
                    </a>
                    <a href="/invoices/cufe" 
                       class="px-4 py-2 text-sm font-medium whitespace-nowrap border-l border-gray-200 {% if active_tab == 'cufe' %}bg-papyrus-blue text-white{% else %}text-gray-600 hover:bg-gray-50{% endif %} transition-colors duration-200">
                        CUFE
                    </a>
                    <a href="/invoices/productos" 
                       class="px-4 py-2 text-sm font-medium whitespace-nowrap border-l border-gray-200 {% if active_tab == 'productos' %}bg-papyrus-blue text-white{% else %}text-gray-600 hover:bg-gray-50{% endif %} transition-colors duration-200">
                        PRODUCTOS
                    </a>
                </div>
            </div>
        </div>
        
        {% block invoice_content %}{% endblock %}
    </div>
</div>

<!-- Toast Notifications -->
<div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>

<script>
    // Utilidades globales
    function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        const colors = {
            success: 'bg-green-500',
            error: 'bg-red-500',
            info: 'bg-blue-500',
            warning: 'bg-yellow-500'
        };
        const icons = {
            success: 'check-circle',
            error: 'exclamation-circle',
            info: 'info-circle',
            warning: 'exclamation-triangle'
        };
        
        toast.className = `${colors[type] || colors.success} px-6 py-4 rounded-lg shadow-lg text-white mb-2 transform transition-all duration-300 ease-in-out`;
        toast.innerHTML = `
            <div class="flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                <span>${message}</span>
            </div>
        `;
        
        const container = document.getElementById('toast-container');
        container.appendChild(toast);
        
        // Animación de entrada
        setTimeout(() => {
            toast.style.transform = 'translateX(0)';
        }, 10);
        
        // Remover después de 3 segundos
        setTimeout(() => {
            toast.style.transform = 'translateX(400px)';
            setTimeout(() => {
                toast.remove();
            }, 300);
        }, 3000);
    }

    function formatCurrency(value) {
        if (!value) return '$0';
        return new Intl.NumberFormat('es-CO', {
            style: 'currency',
            currency: 'COP',
            minimumFractionDigits: 0
        }).format(value);
    }

    function formatDate(dateString) {
        if (!dateString) return '-';
        const date = new Date(dateString);
        return date.toLocaleDateString('es-CO', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
        });
    }

    function formatDateTime(dateString) {
        if (!dateString) return '-';
        const date = new Date(dateString);
        return date.toLocaleString('es-CO', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    function truncateCufe(cufe) {
        if (!cufe) return '-';
        return cufe.substring(0, 16) + '...';
    }
</script>

{% block invoice_scripts %}{% endblock %}
{% endblock %}
