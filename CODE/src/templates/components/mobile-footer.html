<!-- Estilos para el footer móvil -->
<style>
    /* 
     * Detección inteligente de dispositivos móviles
     * Usa múltiples criterios para identificar dispositivos táctiles
     */
    
    /* Regla 1: Dispositivos táctiles con pantalla pequeña o mediana (hasta 1024px) */
    @media (max-width: 1024px) and (hover: none) and (pointer: coarse) {
        #mobile-footer-public {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        
        body {
            padding-bottom: 64px !important;
        }
        
        #desktop-footer {
            display: none !important;
        }
    }
    
    /* Regla 2: Dispositivos con orientación portrait (típico de móviles) */
    @media (orientation: portrait) and (max-width: 1024px) {
        #mobile-footer-public {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        
        body {
            padding-bottom: 64px !important;
        }
        
        #desktop-footer {
            display: none !important;
        }
    }
    
    /* Regla 3: Ocultar en desktop (pantallas grandes con mouse) */
    @media (min-width: 1025px) and (hover: hover) and (pointer: fine) {
        #mobile-footer-public {
            display: none !important;
        }
    }
    
    /* Regla 4: Tablets en landscape - mostrar footer desktop */
    @media (orientation: landscape) and (min-width: 1024px) {
        #mobile-footer-public {
            display: none !important;
        }
    }
    
    /* Mejorar interacción táctil en botones del footer móvil */
    .mobile-footer-btn {
        -webkit-tap-highlight-color: rgba(30, 64, 175, 0.1);
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }
    
    /* Feedback visual al tocar (sin hover) */
    .mobile-footer-btn:active {
        background-color: rgba(30, 64, 175, 0.05);
        transform: scale(0.95);
    }
    
    /* Feedback especial para WhatsApp (verde) */
    .mobile-footer-btn[href*="wa.me"]:active {
        background-color: rgba(34, 197, 94, 0.05);
        color: #16a34a;
    }
    
    /* Clase para feedback táctil con JavaScript */
    .mobile-footer-btn.touch-active {
        background-color: rgba(30, 64, 175, 0.1);
        color: #1e40af;
    }
    
    /* Feedback táctil especial para WhatsApp */
    .mobile-footer-btn[href*="wa.me"].touch-active {
        background-color: rgba(34, 197, 94, 0.1);
        color: #16a34a;
    }
    
    /* Prevenir comportamiento hover en dispositivos táctiles */
    @media (hover: none) and (pointer: coarse) {
        .mobile-footer-btn:hover {
            color: inherit;
        }
    }
</style>

<!-- Script para detección inteligente y mejora de interacción táctil -->
<script>
(function() {
    // Esperar a que el DOM esté listo
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initMobileFooter);
    } else {
        initMobileFooter();
    }
    
    function initMobileFooter() {
        const footer = document.getElementById('mobile-footer-public');
        if (!footer) return;
        
        // Detección inteligente de dispositivo móvil
        const isMobileDevice = detectMobileDevice();
        
        // LOGS DESHABILITADOS - Cambiar ENABLE_FOOTER_LOGS a true para debugging
        const ENABLE_FOOTER_LOGS = false;
        if (ENABLE_FOOTER_LOGS) {
            console.log('🔍 Detección de dispositivo:', {
                isMobile: isMobileDevice,
                width: window.innerWidth,
                height: window.innerHeight,
                touchSupport: 'ontouchstart' in window,
                orientation: window.screen.orientation?.type || 'unknown',
                userAgent: navigator.userAgent.substring(0, 50) + '...'
            });
        }
        
        // Si es móvil, asegurar que el footer esté visible
        if (isMobileDevice) {
            footer.style.display = 'block';
            footer.style.visibility = 'visible';
            footer.style.opacity = '1';
            document.body.style.paddingBottom = '64px';
            
            // Ocultar footer desktop
            const desktopFooter = document.getElementById('desktop-footer');
            if (desktopFooter) {
                desktopFooter.style.display = 'none';
            }
        } else {
            footer.style.display = 'none';
        }
        
        // Configurar feedback táctil solo en dispositivos móviles
        if (isMobileDevice) {
            const footerButtons = document.querySelectorAll('.mobile-footer-btn');
            
            footerButtons.forEach(button => {
                button.addEventListener('touchstart', function(e) {
                    this.classList.add('touch-active');
                }, { passive: true });
                
                button.addEventListener('touchend', function(e) {
                    setTimeout(() => {
                        this.classList.remove('touch-active');
                    }, 150);
                }, { passive: true });
                
                button.addEventListener('touchcancel', function(e) {
                    this.classList.remove('touch-active');
                }, { passive: true });
            });
        }
        
        // Redetectar en cambios de orientación
        window.addEventListener('orientationchange', function() {
            setTimeout(() => {
                const newIsMobile = detectMobileDevice();
                if (newIsMobile !== isMobileDevice) {
                    location.reload(); // Recargar para aplicar cambios
                }
            }, 200);
        });
    }
    
    function detectMobileDevice() {
        // Criterio 1: Soporte táctil
        const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        
        // Criterio 2: Ancho de pantalla (hasta 1024px para incluir móviles grandes)
        const isNarrowScreen = window.innerWidth <= 1024;
        
        // Criterio 3: User Agent (detección de dispositivos móviles conocidos)
        const mobileRegex = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i;
        const isMobileUA = mobileRegex.test(navigator.userAgent);
        
        // Criterio 4: Orientación portrait (típico de móviles)
        const isPortrait = window.innerHeight > window.innerWidth;
        
        // Criterio 5: Detección de pointer coarse (pantalla táctil)
        const hasCoarsePointer = window.matchMedia('(pointer: coarse)').matches;
        
        // Criterio 6: No tiene hover (típico de dispositivos táctiles)
        const noHover = window.matchMedia('(hover: none)').matches;
        
        // Decisión: Es móvil si cumple al menos 2 de estos criterios
        const mobileScore = [
            hasTouch,
            isNarrowScreen,
            isMobileUA,
            (isPortrait && isNarrowScreen),
            hasCoarsePointer,
            noHover
        ].filter(Boolean).length;
        
        // Es móvil si tiene score >= 2 o si es definitivamente un móvil por UA
        return mobileScore >= 2 || isMobileUA;
    }
})();
</script>
