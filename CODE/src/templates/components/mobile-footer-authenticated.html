<!-- Footer Sticky para Móvil - Solo para usuarios autenticados -->
<!-- VERSION: 2025-11-29-v2 - Footer autenticado personalizado -->
<footer id="mobile-footer-authenticated" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-50">
    <!-- Botones de navegación -->
    <div class="flex justify-around items-center h-16 px-0.5">
        <!-- Anuncio -->
        <a href="/announce" 
           class="mobile-footer-btn flex flex-col items-center justify-center flex-1 py-1.5 px-0.5 text-gray-600 active:text-papyrus-blue transition-colors duration-200 {% if request.path == '/announce' %}text-papyrus-blue{% endif %}">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path>
            </svg>
            <span class="text-xs font-medium whitespace-nowrap">Anuncio</span>
        </a>

        <!-- Buscar -->
        <a href="/search" 
           class="mobile-footer-btn flex flex-col items-center justify-center flex-1 py-1.5 px-0.5 text-gray-600 active:text-papyrus-blue transition-colors duration-200 {% if request.path == '/search' %}text-papyrus-blue{% endif %}">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <span class="text-xs font-medium whitespace-nowrap">Buscar</span>
        </a>

        <!-- Paquetes - Icono destacado sin texto -->
        <a href="/packages" 
           class="mobile-footer-btn flex flex-col items-center justify-center flex-1 py-2 px-0.5 text-gray-600 active:text-papyrus-blue transition-colors duration-200 relative {% if request.path == '/packages' %}text-papyrus-blue{% endif %}">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
            </svg>
            <!-- Badge de Paquetes ANUNCIADOS (pendientes de recibir) -->
            <div id="packages-badge-footer"
                class="hidden absolute top-1 right-2 bg-papyrus-blue text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center min-w-[20px] animate-pulse shadow-lg">
                <span id="packages-count-footer" class="text-[11px]">0</span>
            </div>
        </a>

        <!-- Mensajes -->
        <a href="/messages" 
           class="mobile-footer-btn flex flex-col items-center justify-center flex-1 py-1.5 px-0.5 text-gray-600 active:text-papyrus-blue transition-colors duration-200 relative {% if request.path == '/messages' %}text-papyrus-blue{% endif %}">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
            </svg>
            <span class="text-xs font-medium whitespace-nowrap">Mensajes</span>
            <!-- Badge de Mensajes no leídos -->
            <div id="messages-badge-footer"
                class="hidden absolute -top-0.5 -right-0.5 bg-papyrus-red text-white text-xs font-bold rounded-full h-4 w-4 flex items-center justify-center min-w-[16px] animate-pulse">
                <span id="messages-count-footer" class="text-[10px]">0</span>
            </div>
        </a>

        <!-- Clientes -->
        <a href="/customers/manage" 
           class="mobile-footer-btn flex flex-col items-center justify-center flex-1 py-1.5 px-0.5 text-gray-600 active:text-papyrus-blue transition-colors duration-200 {% if request.path == '/customers/manage' or request.path.startswith('/customers') %}text-papyrus-blue{% endif %}">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
            <span class="text-xs font-medium whitespace-nowrap">Clientes</span>
        </a>
    </div>
</footer>

<!-- Estilos para el footer móvil autenticado -->
<style>
    /* 
     * Detección inteligente de dispositivos móviles
     * Usa múltiples criterios para identificar dispositivos táctiles
     */
    
    /* Regla 1: Dispositivos táctiles con pantalla pequeña o mediana (hasta 1024px) */
    @media (max-width: 1024px) and (hover: none) and (pointer: coarse) {
        #mobile-footer-authenticated {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        
        body {
            padding-bottom: 64px !important;
        }
        
        #desktop-footer {
            display: none !important;
        }
    }
    
    /* Regla 2: Dispositivos con orientación portrait (típico de móviles) */
    @media (orientation: portrait) and (max-width: 1024px) {
        #mobile-footer-authenticated {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        
        body {
            padding-bottom: 64px !important;
        }
        
        #desktop-footer {
            display: none !important;
        }
    }
    
    /* Regla 3: Ocultar en desktop (pantallas grandes con mouse) */
    @media (min-width: 1025px) and (hover: hover) and (pointer: fine) {
        #mobile-footer-authenticated {
            display: none !important;
        }
    }
    
    /* Regla 4: Tablets en landscape - mostrar footer desktop */
    @media (orientation: landscape) and (min-width: 1024px) {
        #mobile-footer-authenticated {
            display: none !important;
        }
    }
    
    /* Mejorar interacción táctil en botones del footer móvil */
    .mobile-footer-btn {
        -webkit-tap-highlight-color: rgba(30, 64, 175, 0.1);
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }
    
    /* Feedback visual al tocar (sin hover) */
    .mobile-footer-btn:active {
        background-color: rgba(30, 64, 175, 0.05);
        transform: scale(0.95);
    }
    
    /* Clase para feedback táctil con JavaScript */
    .mobile-footer-btn.touch-active {
        background-color: rgba(30, 64, 175, 0.1);
        color: #1e40af;
    }
    
    /* Prevenir comportamiento hover en dispositivos táctiles */
    @media (hover: none) and (pointer: coarse) {
        .mobile-footer-btn:hover {
            color: inherit;
        }
    }
</style>

<!-- Script para detección inteligente y mejora de interacción táctil -->
<script>
(function() {
    // Esperar a que el DOM esté listo
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initMobileFooterAuthenticated);
    } else {
        initMobileFooterAuthenticated();
    }
    
    function initMobileFooterAuthenticated() {
        const footer = document.getElementById('mobile-footer-authenticated');
        if (!footer) return;
        
        // Detección inteligente de dispositivo móvil
        const isMobileDevice = detectMobileDevice();
        
        // LOGS DESHABILITADOS - Cambiar ENABLE_FOOTER_LOGS a true para debugging
        const ENABLE_FOOTER_LOGS = false;
        if (ENABLE_FOOTER_LOGS) {
            console.log('🔍 Detección de dispositivo (autenticado):', {
                isMobile: isMobileDevice,
                width: window.innerWidth,
                height: window.innerHeight,
                touchSupport: 'ontouchstart' in window,
                orientation: window.screen.orientation?.type || 'unknown',
                userAgent: navigator.userAgent.substring(0, 50) + '...'
            });
        }
        
        // Si es móvil, asegurar que el footer esté visible
        if (isMobileDevice) {
            footer.style.display = 'block';
            footer.style.visibility = 'visible';
            footer.style.opacity = '1';
            document.body.style.paddingBottom = '64px';
            
            // Ocultar footer desktop
            const desktopFooter = document.getElementById('desktop-footer');
            if (desktopFooter) {
                desktopFooter.style.display = 'none';
            }
        } else {
            footer.style.display = 'none';
        }
        
        // Configurar feedback táctil solo en dispositivos móviles
        if (isMobileDevice) {
            const footerButtons = document.querySelectorAll('.mobile-footer-btn');
            
            footerButtons.forEach(button => {
                button.addEventListener('touchstart', function(e) {
                    this.classList.add('touch-active');
                }, { passive: true });
                
                button.addEventListener('touchend', function(e) {
                    setTimeout(() => {
                        this.classList.remove('touch-active');
                    }, 150);
                }, { passive: true });
                
                button.addEventListener('touchcancel', function(e) {
                    this.classList.remove('touch-active');
                }, { passive: true });
            });
        }
        
        // Redetectar en cambios de orientación
        window.addEventListener('orientationchange', function() {
            setTimeout(() => {
                const newIsMobile = detectMobileDevice();
                if (newIsMobile !== isMobileDevice) {
                    location.reload(); // Recargar para aplicar cambios
                }
            }, 200);
        });
        
        // Sincronizar badges del footer con los del header
        if (isMobileDevice) {
            syncFooterBadges();
        }
    }
    
    // Función para sincronizar badges del footer con el header
    function syncFooterBadges() {
        // MUTATION OBSERVERS DESHABILITADOS - Causan alto uso de CPU
        // Cambiar ENABLE_BADGE_SYNC a true para reactivar sincronización automática
        const ENABLE_BADGE_SYNC = false;
        
        // Sincronizar badge de mensajes
        const headerMessagesBadge = document.getElementById('messages-badge');
        const headerMessagesCount = document.getElementById('messages-count');
        const footerMessagesBadge = document.getElementById('messages-badge-footer');
        const footerMessagesCount = document.getElementById('messages-count-footer');
        
        if (headerMessagesBadge && footerMessagesBadge) {
            // Sincronizar estado inicial (una sola vez)
            if (!headerMessagesBadge.classList.contains('hidden')) {
                footerMessagesBadge.classList.remove('hidden');
                if (headerMessagesCount && footerMessagesCount) {
                    footerMessagesCount.textContent = headerMessagesCount.textContent;
                }
            }
            
            // MutationObserver DESHABILITADO para evitar alto uso de CPU
            if (ENABLE_BADGE_SYNC) {
                const observer = new MutationObserver(function(mutations) {
                    mutations.forEach(function(mutation) {
                        if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
                            if (headerMessagesBadge.classList.contains('hidden')) {
                                footerMessagesBadge.classList.add('hidden');
                            } else {
                                footerMessagesBadge.classList.remove('hidden');
                            }
                        }
                    });
                });
                observer.observe(headerMessagesBadge, { attributes: true });
            }
        }
        
        // Sincronizar badge de paquetes
        const headerPackagesBadge = document.getElementById('packages-badge');
        const headerPackagesCount = document.getElementById('packages-count');
        const footerPackagesBadge = document.getElementById('packages-badge-footer');
        const footerPackagesCount = document.getElementById('packages-count-footer');
        
        if (headerPackagesBadge && footerPackagesBadge) {
            // Sincronizar estado inicial (una sola vez)
            if (!headerPackagesBadge.classList.contains('hidden')) {
                footerPackagesBadge.classList.remove('hidden');
                if (headerPackagesCount && footerPackagesCount) {
                    footerPackagesCount.textContent = headerPackagesCount.textContent;
                }
            }
            
            // MutationObserver DESHABILITADO para evitar alto uso de CPU
            if (ENABLE_BADGE_SYNC) {
                const observer = new MutationObserver(function(mutations) {
                    mutations.forEach(function(mutation) {
                        if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
                            if (headerPackagesBadge.classList.contains('hidden')) {
                                footerPackagesBadge.classList.add('hidden');
                            } else {
                                footerPackagesBadge.classList.remove('hidden');
                            }
                        }
                    });
                });
                observer.observe(headerPackagesBadge, { attributes: true });
            }
        }
        
        // Observar cambios en los contadores de texto - DESHABILITADO
        if (ENABLE_BADGE_SYNC) {
            if (headerMessagesCount && footerMessagesCount) {
                const messagesObserver = new MutationObserver(function() {
                    footerMessagesCount.textContent = headerMessagesCount.textContent;
                });
                messagesObserver.observe(headerMessagesCount, { childList: true, characterData: true, subtree: true });
            }
            
            if (headerPackagesCount && footerPackagesCount) {
                const packagesObserver = new MutationObserver(function() {
                    footerPackagesCount.textContent = headerPackagesCount.textContent;
                });
                packagesObserver.observe(headerPackagesCount, { childList: true, characterData: true, subtree: true });
            }
        }
    }
    
    function detectMobileDevice() {
        // Criterio 1: Soporte táctil
        const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        
        // Criterio 2: Ancho de pantalla (hasta 1024px para incluir móviles grandes)
        const isNarrowScreen = window.innerWidth <= 1024;
        
        // Criterio 3: User Agent (detección de dispositivos móviles conocidos)
        const mobileRegex = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i;
        const isMobileUA = mobileRegex.test(navigator.userAgent);
        
        // Criterio 4: Orientación portrait (típico de móviles)
        const isPortrait = window.innerHeight > window.innerWidth;
        
        // Criterio 5: Detección de pointer coarse (pantalla táctil)
        const hasCoarsePointer = window.matchMedia('(pointer: coarse)').matches;
        
        // Criterio 6: No tiene hover (típico de dispositivos táctiles)
        const noHover = window.matchMedia('(hover: none)').matches;
        
        // Decisión: Es móvil si cumple al menos 2 de estos criterios
        const mobileScore = [
            hasTouch,
            isNarrowScreen,
            isMobileUA,
            (isPortrait && isNarrowScreen),
            hasCoarsePointer,
            noHover
        ].filter(Boolean).length;
        
        // Es móvil si tiene score >= 2 o si es definitivamente un móvil por UA
        return mobileScore >= 2 || isMobileUA;
    }
})();
</script>
