{#
  Fragmento de resultados de `/administracion/estadisticas-cobro`
  (rediseño de tablero, `.scratch/estadisticas-cobro-dashboard`) -- lo que el
  fetch en vivo del `<script>` de `estadisticas_cobro.html` reemplaza por
  completo (innerHTML) en cada cambio de filtro (mismo mecanismo que
  `packages/_resultados.html`: la ruta decide esta plantilla o la completa
  según el header `X-Requested-With`, ver `admin.py`). La barra de filtros
  vive FUERA de este fragmento -- no hace falta recalcularla en cada
  actualización.

  Tres zonas, cada una con su carril de color (ver `_estadisticas_tarjetas.
  html::zona`): Panorama (azul, fijo), Ahora (ámbar, fijo) y Periodo
  seleccionado (verde, responde a los filtros de arriba).

  Cada tarjeta de "Periodo seleccionado" declara su propia posición en la
  matriz de "no aplica" (ticket 02, `.scratch/estadisticas-cobro-dashboard/
  spec.md`): `no_aplica(tipo_aplica, anulado_aplica, filtro_tipo,
  filtro_estado_cobro)` -- los primeros dos son fijos por tarjeta (1 = el
  filtro SÍ la acota), los últimos dos son el estado real de los filtros.
#}
{% from "admin/_estadisticas_tarjetas.html" import tarjeta_panorama, tarjeta_periodo, tarjeta_periodo_trio, tarjeta_periodo_texto, no_aplica, zona, etiqueta_rango, formato %}

{%- set chips = [] -%}
{%- if tablero.periodo.rango_activo %}{% set _ = chips.append(etiqueta_rango(tablero.periodo.rango_activo)) %}{% endif -%}
{%- if filtro_tipo %}{% set _ = chips.append('Normal' if filtro_tipo == 'NORMAL' else 'Extra-dimensionado') %}{% endif -%}
{%- if filtro_estado_cobro %}{% set _ = chips.append('Cobrado' if filtro_estado_cobro == 'cobrado' else 'Anulado') %}{% endif -%}

<div class="space-y-4">
  {% call zona('bg-blue-600', 'Panorama: hoy, esta semana y este mes -- no cambia con los filtros de arriba') %}
    {{ tarjeta_panorama('Ingresos', tablero.panorama.ingresos, 'cop', 'lg:col-span-6') }}
  {% endcall %}

  {% call zona('bg-amber-500', 'Ahora: foto del momento -- no cambia con los filtros de arriba', vacio=True) %}
  {% endcall %}

  {% call zona('bg-emerald-600', 'Periodo seleccionado: responde a los filtros de arriba') %}
    <div class="lg:col-span-12 flex flex-wrap items-center gap-1.5" aria-label="Filtros activos">
      {%- if chips %}
      {%- for chip in chips %}
      <span class="inline-flex items-center rounded-full bg-emerald-50 text-emerald-700 text-xs font-medium px-2.5 py-1">{{ chip }}</span>
      {%- endfor %}
      {%- else %}
      <span class="inline-flex items-center rounded-full bg-slate-100 text-slate-600 text-xs font-medium px-2.5 py-1">Todos los datos</span>
      {%- endif %}
    </div>
    {{ tarjeta_periodo('Total de ingresos', tablero.periodo.recaudo.total_ingresos, 'cop', 'lg:col-span-3', 'Recaudo', no_aplica=no_aplica(1, 1, filtro_tipo, filtro_estado_cobro)) }}
    {{ tarjeta_periodo('Promedio recaudado por paquete', tablero.periodo.recaudo.promedio_por_paquete, 'cop', 'lg:col-span-3', 'Recaudo', no_aplica=no_aplica(1, 1, filtro_tipo, filtro_estado_cobro)) }}
    {{ tarjeta_periodo('Recaudado por bodegaje', tablero.periodo.recaudo.recaudado_bodegaje, 'cop', 'lg:col-span-3', 'Recaudo', detalle=(formato(tablero.periodo.recaudo.porcentaje_bodegaje, 'pct') ~ ' del recaudo') if tablero.periodo.recaudo.porcentaje_bodegaje is not none else none, no_aplica=no_aplica(1, 1, filtro_tipo, filtro_estado_cobro)) }}
    {{ tarjeta_periodo('Recaudado por servicio', tablero.periodo.recaudo.recaudado_servicio, 'cop', 'lg:col-span-3', 'Recaudo', detalle=(formato(tablero.periodo.recaudo.porcentaje_servicio, 'pct') ~ ' del recaudo') if tablero.periodo.recaudo.porcentaje_servicio is not none else none, no_aplica=no_aplica(1, 1, filtro_tipo, filtro_estado_cobro)) }}
    {{ tarjeta_periodo('Exonerado por anulaciones', tablero.periodo.recaudo.exonerado_anulaciones, 'cop', 'lg:col-span-4', 'Recaudo', detalle='Estimado con las tarifas vigentes -- ' ~ formato(tablero.periodo.recaudo.cantidad_anulaciones, 'int') ~ ' anulaciones' ~ ((' · ' ~ formato(tablero.periodo.recaudo.tasa_anulacion, 'pct') ~ ' de los cobros') if tablero.periodo.recaudo.tasa_anulacion is not none else ''), no_aplica=no_aplica(1, 1, filtro_tipo, filtro_estado_cobro)) }}
    {{ tarjeta_periodo('Exenciones por primera entrega', tablero.periodo.recaudo.exenciones_primera_entrega, 'int', 'lg:col-span-4', 'Recaudo', detalle='Estimado: ' ~ formato(tablero.periodo.recaudo.dejado_de_cobrar_primera_entrega, 'cop') ~ ' que se dejaron de cobrar', no_aplica=no_aplica(1, 0, filtro_tipo, filtro_estado_cobro)) }}
    {{ tarjeta_periodo('Cobro más alto', tablero.periodo.recaudo.cobro_mas_alto, 'cop', 'lg:col-span-4', 'Recaudo', detalle=(formato(tablero.periodo.recaudo.dias_bodega_del_mas_alto, 'int') ~ ' días en bodega') if tablero.periodo.recaudo.dias_bodega_del_mas_alto is not none else none, no_aplica=no_aplica(1, 1, filtro_tipo, filtro_estado_cobro)) }}

    {{ tarjeta_periodo('Total de paquetes', tablero.periodo.paquetes.total, 'int', 'lg:col-span-3', 'Paquetes', no_aplica=no_aplica(0, 0, filtro_tipo, filtro_estado_cobro)) }}
    {{ tarjeta_periodo('Anunciados', tablero.periodo.paquetes.anunciados, 'int', 'lg:col-span-3', 'Paquetes', no_aplica=no_aplica(0, 0, filtro_tipo, filtro_estado_cobro)) }}
    {{ tarjeta_periodo('Recibidos', tablero.periodo.paquetes.recibidos, 'int', 'lg:col-span-3', 'Paquetes', no_aplica=no_aplica(1, 0, filtro_tipo, filtro_estado_cobro)) }}
    {{ tarjeta_periodo('Entregados', tablero.periodo.paquetes.entregados, 'int', 'lg:col-span-3', 'Paquetes', no_aplica=no_aplica(1, 0, filtro_tipo, filtro_estado_cobro)) }}
    {{ tarjeta_periodo('Cancelados', tablero.periodo.paquetes.cancelados, 'int', 'lg:col-span-3', 'Paquetes', no_aplica=no_aplica(0, 0, filtro_tipo, filtro_estado_cobro)) }}

    {{ tarjeta_periodo_trio('Anunciados', tablero.periodo.ritmo.anunciados.por_dia, tablero.periodo.ritmo.anunciados.por_semana, tablero.periodo.ritmo.anunciados.por_mes, 'dec', 'lg:col-span-6', 'Ritmo', no_aplica=no_aplica(0, 0, filtro_tipo, filtro_estado_cobro)) }}
    {{ tarjeta_periodo_trio('Recibidos', tablero.periodo.ritmo.recibidos.por_dia, tablero.periodo.ritmo.recibidos.por_semana, tablero.periodo.ritmo.recibidos.por_mes, 'dec', 'lg:col-span-6', 'Ritmo', no_aplica=no_aplica(1, 0, filtro_tipo, filtro_estado_cobro)) }}
    {{ tarjeta_periodo_trio('Entregados', tablero.periodo.ritmo.entregados.por_dia, tablero.periodo.ritmo.entregados.por_semana, tablero.periodo.ritmo.entregados.por_mes, 'dec', 'lg:col-span-6', 'Ritmo', no_aplica=no_aplica(1, 0, filtro_tipo, filtro_estado_cobro)) }}
    {{ tarjeta_periodo('Tasa de entrega', tablero.periodo.ritmo.tasa_entrega, 'pct', 'lg:col-span-3', 'Tasas', detalle='entregados ÷ cerrados', no_aplica=no_aplica(0, 0, filtro_tipo, filtro_estado_cobro)) }}
    {{ tarjeta_periodo('Tasa de cancelación', tablero.periodo.ritmo.tasa_cancelacion, 'pct', 'lg:col-span-3', 'Tasas', detalle='cancelados ÷ cerrados', no_aplica=no_aplica(0, 0, filtro_tipo, filtro_estado_cobro)) }}

    {{ tarjeta_periodo('Clientes activos', tablero.periodo.clientes.activos, 'int', 'lg:col-span-3', 'Clientes', detalle='con al menos un paquete en el periodo', no_aplica=no_aplica(1, 0, filtro_tipo, filtro_estado_cobro)) }}
    {{ tarjeta_periodo('Clientes nuevos', tablero.periodo.clientes.nuevos, 'int', 'lg:col-span-3', 'Clientes', detalle='su primera entrega fue en el periodo', no_aplica=no_aplica(1, 0, filtro_tipo, filtro_estado_cobro)) }}
    {{ tarjeta_periodo('Clientes recurrentes', tablero.periodo.clientes.recurrentes, 'int', 'lg:col-span-3', 'Clientes', detalle='2 o más paquetes en el periodo', no_aplica=no_aplica(1, 0, filtro_tipo, filtro_estado_cobro)) }}

    {%- set top_paquetes = tablero.periodo.clientes.con_mas_paquetes -%}
    {%- set detalle_top_paquetes = none -%}
    {%- if top_paquetes -%}
      {%- set detalle_top_paquetes = (top_paquetes.apartamento ~ ' · ' if top_paquetes.apartamento else '') ~ formato(top_paquetes.valor, 'int') ~ ' paquetes' -%}
    {%- endif %}
    {{ tarjeta_periodo_texto('Cliente con más paquetes', top_paquetes.nombre if top_paquetes else none, 'lg:col-span-3', 'Clientes', detalle=detalle_top_paquetes, no_aplica=no_aplica(1, 0, filtro_tipo, filtro_estado_cobro)) }}

    {%- set top_gasto = tablero.periodo.clientes.con_mayor_gasto -%}
    {%- set detalle_top_gasto = none -%}
    {%- if top_gasto -%}
      {%- set detalle_top_gasto = (top_gasto.apartamento ~ ' · ' if top_gasto.apartamento else '') ~ formato(top_gasto.valor, 'cop') -%}
    {%- endif %}
    {{ tarjeta_periodo_texto('Cliente con mayor gasto', top_gasto.nombre if top_gasto else none, 'lg:col-span-3', 'Clientes', detalle=detalle_top_gasto, no_aplica=no_aplica(1, 1, filtro_tipo, filtro_estado_cobro)) }}
  {% endcall %}
</div>
