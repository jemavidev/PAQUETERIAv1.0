# ========================================
# PAQUETERÍA STAGING - ULTRA MINIMAL
# ========================================
# Solo App para visualizar cambios CSS/HTML
# RAM: 416MB + 1GB SWAP
# ========================================

name: "PAQUETERIA_STAGING"

services:
  # ========================================
  # APP - FastAPI (Solo visualización)
  # ========================================
  app:
    build:
      context: ./CODE
      dockerfile: Dockerfile
    image: paqueteria_staging_app:latest
    container_name: paqueteria_staging_app
    network_mode: host
    env_file:
      - ./CODE/.env
    environment:
      - TZ=America/Bogota
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - ENVIRONMENT=staging
      # Sin Redis - usar cache en memoria
      - REDIS_ENABLED=false
    restart: unless-stopped
    # Límites de memoria estrictos
    mem_limit: 300m
    mem_reservation: 200m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 120s
      timeout: 10s
      retries: 2
      start_period: 60s
    volumes:
      # Archivos estáticos editables sin rebuild (CSS, JS, imágenes, PDFs)
      - ./CODE/src/static:/app/src/static
      # Templates HTML editables sin rebuild
      - ./CODE/src/templates:/app/src/templates
      # Datos persistentes (mínimos)
      - uploads_staging_data:/app/uploads
      - logs_staging_data:/app/logs
    command: >
      sh -c "mkdir -p /app/uploads && 
             cd /app && 
             python -m uvicorn src.main:app 
             --host 127.0.0.1 
             --port 8001 
             --workers 1
             --limit-concurrency 50
             --timeout-keep-alive 20
             --log-level warning"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# ========================================
# VOLÚMENES - Mínimos
# ========================================
volumes:
  uploads_staging_data:
    driver: local
  logs_staging_data:
    driver: local

# ========================================
# REDES - No necesarias con network_mode: host
# ========================================
