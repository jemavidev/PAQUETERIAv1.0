# ========================================
# PAQUETERÍA v1.0 - DOCKER COMPOSE STAGING
# ========================================
# Entorno de staging para pruebas visuales y estéticas
# Sin conflictos con producción
# ========================================

name: "PAQUETERIA_STAGING"

services:
  # ========================================
  # REDIS - Cache (Puerto 6380 para evitar conflicto)
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: paqueteria_staging_redis
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-Redis2025!Secure} 
      --maxmemory 128mb 
      --maxmemory-policy allkeys-lru
      --port 6380
    ports:
      - "127.0.0.1:6380:6380"
    volumes:
      - redis_staging_data:/data
    restart: unless-stopped
    environment:
      - TZ=America/Bogota
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "-a", "${REDIS_PASSWORD:-Redis2025!Secure}", "--raw", "incr", "ping"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - paqueteria_staging_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # ========================================
  # APP - FastAPI (Puerto 8001 para evitar conflicto)
  # ========================================
  app:
    build:
      context: ./CODE
      dockerfile: Dockerfile
    image: paqueteria_staging_app:latest
    container_name: paqueteria_staging_app
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./.env.staging
    environment:
      - TZ=America/Bogota
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - ENVIRONMENT=staging
      - REDIS_URL=redis://:${REDIS_PASSWORD:-Redis2025!Secure}@redis:6380/0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "0.0.0.0:8001:8000"
    volumes:
      # Código Python (read-only para seguridad)
      - ./CODE/src/app:/app/src/app:ro
      - ./CODE/src/scripts:/app/src/scripts:ro
      - ./CODE/src/main.py:/app/src/main.py:ro
      - ./CODE/src/__init__.py:/app/src/__init__.py:ro
      # Archivos estáticos editables sin rebuild (CSS, JS, imágenes, PDFs)
      - ./CODE/src/static:/app/src/static
      # Templates HTML editables sin rebuild
      - ./CODE/src/templates:/app/src/templates
      # Datos persistentes
      - uploads_staging_data:/app/uploads
      - logs_staging_data:/app/logs
      # Socket de Docker para sincronización
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    command: >
      sh -c "mkdir -p /app/uploads && 
             cd /app && 
             python -c 'from src.uvicorn_config import *; import uvicorn; uvicorn.run(\"src.main:app\", host=HOST, port=PORT, workers=WORKERS, limit_concurrency=LIMIT_CONCURRENCY, timeout_keep_alive=TIMEOUT_KEEP_ALIVE, log_level=LOG_LEVEL)'"
    networks:
      - paqueteria_staging_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

# ========================================
# VOLÚMENES - Separados de producción
# ========================================
volumes:
  redis_staging_data:
    driver: local
  uploads_staging_data:
    driver: local
  logs_staging_data:
    driver: local

# ========================================
# REDES - Red separada de producción
# ========================================
networks:
  paqueteria_staging_network:
    driver: bridge
    name: paqueteria_staging_network
